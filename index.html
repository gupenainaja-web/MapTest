{id:'inq',name:'Science Practices',short:'Practices',levels:{
1:{s:'Observing with the senses',g:SI([
 ['Mali looks closely at a leaf with a hand lens. What is she doing?','observing','guessing','weighing','tasting','Using your senses and tools to look closely is observing.'],
 ['Which sentence is an <b>observation</b>?','The ball is red.','The ball is the best toy.','I think it will rain next week.','Red balls are lucky.','An observation describes what you can see, hear, feel or measure.'],
 ['Which tool helps you see tiny things up close?','magnifying glass','ruler','thermometer','clock','A magnifying glass makes things look bigger.'],
 ['Which should you <b>never</b> do with an unknown substance in science class?','taste it','look at it','draw it','describe its color','For safety, never taste things in a science lab.']])},
2:{s:'Comparing and sorting',g:SI([
 ['Which is heavier, a brick or a feather?','the brick','the feather','They weigh the same.','You cannot tell.','A brick has much more mass than a feather.'],
 ['You put red buttons in one group and blue buttons in another. You sorted them by ___.','color','size','weight','smell','The groups were made by color.'],
 ['Which tool compares which of two objects is heavier?','balance','thermometer','clock','magnifying glass','The heavier side of a balance goes down.'],
 ['Which group has only things that float on water?','a leaf, a cork, a plastic duck','a stone, a nail, a coin','a cork, a coin, a leaf','a nail, a plastic duck, a stone','Leaves, corks and plastic ducks float; stones, nails and coins sink.']])},
3:{s:'Measuring with tools and units',g:SI([
 ['Which tool measures length?','ruler','thermometer','balance','stopwatch','A ruler measures length in centimeters or meters.'],
 ['Which unit is used to measure temperature?','degrees Celsius (°C)','centimeters','kilograms','liters','Temperature is measured in degrees Celsius.'],
 ['Which tool measures the volume of a liquid?','measuring cylinder','ruler','spring scale','magnet','A measuring cylinder shows volume in milliliters.'],
 ['Which tool measures how long it takes to run a race?','stopwatch','thermometer','ruler','balance','A stopwatch measures time.']])},
4:{s:'Reading a data table',g:R=>{const w=R.int(2,4);const h=[R.int(2,4)];for(let i=1;i<5;i++)h.push(h[i-1]+R.int(1,4));const tbl=htmlTable(['Week','1','2','3','4','5'],[['Height (cm)',...h]]);
  if(R.bool())return Q(R,`The table shows the height of a bean plant. How tall was the plant in week ${w}?`,`${h[w-1]} cm`,[`${h[w]} cm`,`${h[w-2]} cm`,`${w} cm`,`${h[w-1]+1} cm`,`${h[w-1]+2} cm`],`Find week ${w} in the table: ${h[w-1]} cm.`,tbl);
  return Q(R,'The table shows the height of a bean plant. How much did it grow from week 1 to week 5?',`${h[4]-h[0]} cm`,[`${h[4]} cm`,`${h[4]+h[0]} cm`,`${h[4]-h[0]+1} cm`,`${h[4]-h[0]-1} cm`],`${h[4]} − ${h[0]} = ${h[4]-h[0]} cm.`,tbl)}},
5:{s:'Making predictions from patterns',g:R=>{const r=R.pick([30,40,50,60]);const ds=[1,2,3];const b=ds.map(d=>d*r);const tbl=htmlTable(['Drop height (m)','1','2','3','4'],[['Bounce height (cm)',b[0],b[1],b[2],'?']]);
  return Q(R,'A ball is dropped from different heights. Use the pattern to predict how high it will bounce when dropped from 4 m.',`${4*r} cm`,[`${3*r+10} cm`,`${b[2]} cm`,`${2*r} cm`],`Each extra meter adds ${r} cm, so 4 m → ${4*r} cm.`,tbl)}},
6:{s:'Reading bar graphs of results',g:R=>{const L=['Sun+water','Shade+water','Sun, no water','Dark, no water'];const v=[R.int(14,18),R.int(9,12),R.int(3,6),R.int(0,2)].map(x=>x);const k=R.int(0,1);
  const fig=svgBarChart(['A','B','C','D'],v,2,20,'Seeds sprouted (out of 20)')+htmlTable(['Group','Condition'],L.map((x,i)=>['ABCD'[i],x]));
  if(k===0)return Q(R,'In which group did the most seeds sprout?','A (sun and water)',['B (shade and water)','C (sun, no water)','D (dark, no water)'],'Group A has the tallest bar: seeds sprout best with water and warmth.',fig);
  return Q(R,'How many more seeds sprouted in group A than in group C?',v[0]-v[2],[v[0]+v[2],v[0],v[2]],`${v[0]} − ${v[2]} = ${v[0]-v[2]} seeds.`,fig)}},
7:{s:'Testable questions and hypotheses',g:SI([
 ['Which question can be answered with an experiment?','Does salt water freeze more slowly than fresh water?','Which color is the prettiest?','Is a dog a better pet than a cat?','What is the best song?','A testable question can be answered by measuring something.'],
 ['A hypothesis is ___.','a testable prediction about what will happen','an answer that is always true','a list of materials','a drawing of the results','A hypothesis is a prediction you can test.'],
 ['Which question about plants is testable?','Do bean plants grow taller with more sunlight?','Are roses nicer than tulips?','Do plants feel happy?','Which plant is the most beautiful?','Plant height and sunlight can both be measured.'],
 ['Which statement is a hypothesis?','If plants get more light, then they will grow taller.','Plants are green.','I like plants.','Measure the plant.','"If…, then…" makes a testable prediction.']])},
8:{s:'Fair tests and variables',g:SI([
 ['To test whether fertilizer helps plants grow, what should be <b>different</b> between the two plants?','only the fertilizer','the amount of water','the type of plant','the amount of light','In a fair test, change only one thing and keep everything else the same.'],
 ['In an experiment, the variable you change on purpose is the ___ variable.','independent','dependent','controlled','final','The independent variable is the one the scientist changes.'],
 ['Ann tests which paper towel brand soaks up the most water. What must stay the same?','the amount of water for each towel','the brand of towel','the result','nothing','The brand is changed, so everything else (like the amount of water) must stay the same.'],
 ['What you measure to see the result of an experiment is the ___ variable.','dependent','independent','controlled','hypothesis','The dependent variable is the result you measure.']])},
9:{s:'Line graphs and trends',g:R=>{const t0=R.int(80,90);const d=[0,1,2,3,4].map(i=>t0-[0,15,26,34,40][i]-R.int(0,2));const W=360,H=220,x0=48,y0=180,ph=150;const Y=v=>y0-v/100*ph,X=i=>x0+i*70;
  let s=svgOpen(W,H,'Line graph of water temperature');for(let v=0;v<=100;v+=20)s+=`<line class="f-grid" x1="${x0}" y1="${Y(v)}" x2="${W-10}" y2="${Y(v)}"/><text class="f-tick-l" x="${x0-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+d.map((v,i)=>`<circle class="f-dot" cx="${X(i)}" cy="${Y(v)}" r="5"/><text class="f-tick-l" x="${X(i)}" y="${y0+16}" text-anchor="middle">${i*5}</text>`).join('')+`<text class="f-note" x="8" y="12">Temperature (°C)</text><text class="f-note" x="${W-10}" y="${H-4}" text-anchor="end">Time (minutes)</text></svg>`;
  if(R.bool())return Q(R,'The graph shows the temperature of hot water left in a room. What happens to the temperature over time?','It goes down quickly at first, then more slowly.','It goes up steadily.','It stays the same.','It goes down at the same rate the whole time.','The line falls steeply at first and then flattens out.',s);
  const i=R.int(1,4);return Q(R,`What was the temperature of the water at ${i*5} minutes? (Choose the closest value.)`,`${d[i]} °C`,[`${d[i-1]} °C`,`${d[i]+10} °C`,`${i*5} °C`,`${d[i]-10} °C`,`${d[i]-20} °C`],`Find ${i*5} minutes on the bottom axis and read up to the line: about ${d[i]} °C.`,s)}},
10:{s:'Repeated trials and reliable results',g:SI([
 ['Why do scientists repeat an experiment several times?','to make sure the results are reliable','to use up the materials','to change the results','because the first try is always wrong','Repeating trials shows whether results are consistent.'],
 ['A toy car is timed 3 times: 4.2 s, 4.0 s and 4.4 s. What is the mean time?','4.2 s','4.0 s','4.4 s','12.6 s','(4.2 + 4.0 + 4.4) ÷ 3 = 12.6 ÷ 3 = 4.2 s.'],
 ['A plant was measured 4 times: 12 cm, 13 cm, 31 cm, 12 cm. Which result is most likely a mistake?','31 cm','12 cm','13 cm','None of them','31 cm is very different from the others, so it was probably measured or written wrongly.'],
 ['Why does an experiment use a control group?','to have something to compare the results with','to make the experiment longer','to add more variables','to guess the result','The control group shows what happens without the change being tested.']])},
11:{s:'Drawing conclusions from data',g:R=>{const hs=[10,20,30,40];const base=R.int(30,50),k=R.int(8,15);const dist=hs.map((h,i)=>base+k*i+R.int(0,3));const tbl=htmlTable(['Ramp height (cm)',...hs],[['Distance car travels (cm)',...dist]]);
  return Q(R,'Students rolled a toy car down a ramp at different heights. Which conclusion is best supported by the data?','The higher the ramp, the farther the car travels.','The lower the ramp, the farther the car travels.','Ramp height does not change the distance.','The car always travels the same distance as the ramp height.',`As the ramp height increases from 10 to 40 cm, the distance increases from ${dist[0]} to ${dist[3]} cm.`,tbl)}},
12:{s:'Evaluating experiments and models',g:SI([
 ['After testing one bean plant, a student says, "All plants need fertilizer." What is the biggest problem?','Only one plant was tested.','A bean plant was used.','Height was measured in centimeters.','The plant was green.','One plant is too small a sample to make a conclusion about all plants.'],
 ['Why do scientists use models, such as a globe?','to study things that are too big, small or far away to observe directly','because models are always perfect','to replace all experiments','to make things heavier','Models help us study and explain things we cannot easily see.'],
 ['A model of the solar system made of balls on sticks is limited because ___.','the sizes and distances are not to scale','it is colorful','it shows the planets','it includes the Sun','Real distances are far too large to show at the same scale as the planets.'],
 ['Two groups do the same experiment and get very different results. What should they do first?','check that they followed the same steps, then repeat it','choose the result they like','stop the experiment','make up a new result','Checking the procedure and repeating helps find errors.']])}}}

/* ---------- Science figures ---------- */
function arrowLine(x1,y1,x2,y2,cls,sh){sh=sh||0;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;const ax=x1+ux*sh,ay=y1+uy*sh,bx=x2-ux*sh,by=y2-uy*sh;const hx=bx-ux*10,hy=by-uy*10;
  return `<line class="${cls||'f-line'}" x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}"/><polygon class="f-head" points="${bx.toFixed(1)},${by.toFixed(1)} ${(hx-uy*5).toFixed(1)},${(hy+ux*5).toFixed(1)} ${(hx+uy*5).toFixed(1)},${(hy-ux*5).toFixed(1)}"/>`}
const tag=(x,y,t)=>`<circle class="f-tagc" cx="${x}" cy="${y}" r="11"/><text class="f-tagt" x="${x}" y="${y+5}" text-anchor="middle">${t}</text>`;
function figPlant(){let s=svgOpen(300,260,'Parts of a flowering plant');
  s+=`<rect class="f-soil" x="20" y="170" width="200" height="80" rx="6"/>`;
  s+=`<path class="f-root" d="M120 170 L120 205 M120 185 L95 215 M120 190 L148 222 M120 205 L108 240 M120 205 L132 238 M95 215 L82 232 M148 222 L160 240"/>`;
  s+=`<line class="f-stem" x1="120" y1="170" x2="120" y2="62"/>`;
  s+=`<ellipse class="f-leaf" cx="88" cy="125" rx="32" ry="13" transform="rotate(-25 88 125)"/><ellipse class="f-leaf" cx="152" cy="105" rx="32" ry="13" transform="rotate(25 152 105)"/>`;
  for(let k=0;k<6;k++){const a=k*Math.PI/3;s+=`<circle class="f-petal" cx="${120+16*Math.cos(a)}" cy="${48+16*Math.sin(a)}" r="11"/>`}s+=`<circle class="f-sunc" cx="120" cy="48" r="9"/>`;
  s+=`<line class="f-thin" x1="150" y1="225" x2="240" y2="225"/>${tag(252,225,'1')}<line class="f-thin" x1="122" y1="150" x2="240" y2="150"/>${tag(252,150,'2')}`;
  s+=`<line class="f-thin" x1="175" y1="100" x2="240" y2="88"/>${tag(252,86,'3')}<line class="f-thin" x1="138" y1="40" x2="240" y2="30"/>${tag(252,28,'4')}`;return s+'</svg>'}
function figCycle(labels,missing){const W=380,H=250;let s=svgOpen(W,H,'Life cycle');const P=[[190,34],[310,125],[190,216],[70,125]];
  for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4];s+=arrowLine(a[0],a[1],b[0],b[1],'f-line',58)}
  P.forEach((p,i)=>{const t=i===missing?'?':labels[i];s+=`<rect class="${i===missing?'f-qbox':'f-box2'}" x="${p[0]-62}" y="${p[1]-20}" width="124" height="40" rx="10"/><text class="f-lbl sm" x="${p[0]}" y="${p[1]+5}" text-anchor="middle">${t}</text>`});return s+'</svg>'}
function figFoodWeb(){const N={Hawk:[200,30],Snake:[110,100],Frog:[290,100],Rabbit:[70,180],Grasshopper:[290,180],Grass:[180,250]};const E=[['Grass','Rabbit'],['Grass','Grasshopper'],['Grasshopper','Frog'],['Frog','Snake'],['Rabbit','Snake'],['Snake','Hawk'],['Frog','Hawk']];
  let s=svgOpen(380,300,'Food web');E.forEach(([a,b])=>{const p=N[a],q=N[b];const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);const sh=Math.min(54/Math.max(Math.abs(dx/L),.01),17/Math.max(Math.abs(dy/L),.01))+3;s+=arrowLine(p[0],p[1],q[0],q[1],'f-line',sh)});
  Object.entries(N).forEach(([k,p])=>{s+=`<rect class="${k==='Grass'?'f-leafbox':'f-box2'}" x="${p[0]-52}" y="${p[1]-15}" width="104" height="30" rx="15"/><text class="f-lbl sm" x="${p[0]}" y="${p[1]+5}" text-anchor="middle">${k}</text>`});
  return s+`<text class="f-note" x="190" y="294" text-anchor="middle">Arrows point from food to eater</text></svg>`}
function figDigest(){let s=svgOpen(300,300,'Digestive system');
  s+=`<path class="f-organ" d="M150 20 C130 20 120 40 125 55 L175 55 C180 40 170 20 150 20 Z"/>`;
  s+=`<path class="f-tube" d="M150 55 L150 120"/>`;
  s+=`<path class="f-stomach" d="M150 118 C185 105 215 125 205 155 C198 178 160 182 140 165 C130 157 140 140 150 132 Z"/>`;
  s+=`<path class="f-large" d="M95 280 L95 185 L230 185 L230 280"/>`;
  s+=`<path class="f-small" d="M140 168 C110 190 120 200 150 200 C185 200 190 215 160 222 C120 230 120 245 155 247 C190 249 200 262 165 268 L130 272"/>`;
  s+=`<line class="f-thin" x1="152" y1="88" x2="250" y2="70"/>${tag(262,68,'1')}<line class="f-thin" x1="200" y1="140" x2="250" y2="125"/>${tag(262,123,'2')}`;
  s+=`<line class="f-thin" x1="185" y1="225" x2="250" y2="210"/>${tag(262,208,'3')}<line class="f-thin" x1="230" y1="265" x2="250" y2="268"/>${tag(262,268,'4')}`;
  return s+`<text class="f-note" x="10" y="18">Mouth</text></svg>`}
function figInsect(){let s=svgOpen(300,170,'An animal');
  for(const [x,dy] of [[120,0],[140,0],[160,0]]){s+=`<path class="f-leg" d="M${x} 85 L${x-15} 45 L${x-28} 30"/><path class="f-leg" d="M${x} 85 L${x-15} 125 L${x-28} 142"/>`}
  s+=`<ellipse class="f-body" cx="80" cy="85" rx="20" ry="18"/><ellipse class="f-body" cx="140" cy="85" rx="32" ry="20"/><ellipse class="f-body" cx="215" cy="85" rx="48" ry="26"/>`;
  s+=`<path class="f-leg" d="M68 72 L45 40 M74 70 L60 32"/><circle class="f-pin" cx="72" cy="80" r="3"/>`;return s+'</svg>'}
function figCircuit(kind){/* kind: ok, switch, same, gap */let s=`<g>`;const bulb=`<circle class="f-bulb${kind==='ok'?' on':''}" cx="75" cy="30" r="13"/><path class="f-thin" d="M69 36 L72 26 L75 32 L78 26 L81 36"/>`;
  const batt=`<rect class="f-batt" x="52" y="96" width="46" height="16" rx="3"/><text class="f-tick-l" x="58" y="108">−</text><text class="f-tick-l" x="86" y="108">+</text>`;
  let w=`<path class="f-wire" d="M64 38 L30 38 L30 104 L52 104"/>`;
  if(kind==='gap')w=`<path class="f-wire" d="M64 38 L30 38 L30 62 M30 76 L30 104 L52 104"/>`;
  let r=`<path class="f-wire" d="M86 38 L122 38 L122 104 L98 104"/>`;
  if(kind==='switch')r=`<path class="f-wire" d="M86 38 L122 38 L122 58 M122 80 L122 104 L98 104"/><line class="f-wire" x1="122" y1="80" x2="138" y2="62"/><circle class="f-pin" cx="122" cy="80" r="2.5"/><circle class="f-pin" cx="122" cy="58" r="2.5"/>`;
  if(kind==='same')r=`<path class="f-wire" d="M86 38 L122 38 L122 124 L42 124 L42 104 L52 104"/>`;
  return s+w+r+batt+bulb+'</g>'}
function figCircuits(order){let s=svgOpen(640,170,'Four circuits');order.forEach((k,i)=>{s+=`<g transform="translate(${i*160},10)">${figCircuit(k)}<text class="f-lbl" x="75" y="152" text-anchor="middle">Circuit ${i+1}</text></g>`});return s+'</svg>'}
function figMagnets(a,b){let s=svgOpen(340,90,'Two magnets');const bar=(x,p)=>`<rect class="${p[0]==='N'?'f-magn':'f-mags'}" x="${x}" y="25" width="60" height="36"/><rect class="${p[1]==='N'?'f-magn':'f-mags'}" x="${x+60}" y="25" width="60" height="36"/><text class="f-magt" x="${x+30}" y="50" text-anchor="middle">${p[0]}</text><text class="f-magt" x="${x+90}" y="50" text-anchor="middle">${p[1]}</text>`;
  return s+bar(20,a)+bar(200,b)+'</svg>'}
function figParticles(order){let s=svgOpen(420,150,'Particles in three boxes');const R=mkR(7);
  order.forEach((k,i)=>{const x0=10+i*140;s+=`<rect class="f-box2" x="${x0}" y="10" width="120" height="110" rx="6"/>`;let pts=[];
    if(k==='solid'){for(let r=0;r<4;r++)for(let c=0;c<5;c++)pts.push([x0+20+c*20,72+r*12-(3-r)*8+12])}
    else if(k==='liquid'){for(let j=0;j<15;j++)pts.push([x0+16+(j%6)*18+R.int(-3,3),118-12-Math.floor(j/6)*17+R.int(-4,3)])}
    else{[[25,30],[85,25],[55,60],[100,80],[30,95],[75,105]].forEach(p=>pts.push([x0+p[0],10+p[1]]))}
    pts.forEach(p=>s+=`<circle class="f-dot" cx="${p[0]}" cy="${p[1]}" r="7"/>`);s+=`<text class="f-lbl" x="${x0+60}" y="142" text-anchor="middle">Box ${i+1}</text>`});return s+'</svg>'}
function figShadow(left){let s=svgOpen(360,180,'Lamp and object');const lx=left?40:320,ox=180;
  s+=`<line class="f-line" x1="10" y1="150" x2="350" y2="150"/><circle class="f-sunc" cx="${lx}" cy="60" r="16"/><line class="f-thin" x1="${lx}" y1="76" x2="${lx}" y2="150"/>`;
  s+=`<rect class="f-shape" x="${ox-15}" y="100" width="30" height="50"/>`;
  const sx=left?ox+15:ox-15;s+=`<line class="f-ray" x1="${lx}" y1="60" x2="${sx}" y2="100"/>`;
  const P=left?[[110,165],[180,85],[270,165],[12,165]]:[[250,165],[180,85],[90,165],[348,165]];P.forEach((p,i)=>s+=tag(p[0],p[1]-8+(i===1?0:-2),i+1));return s+'</svg>'}

for(const [id,lv] of Object.entries(SCI_MS)){const t=SCI_TOPICS.find(x=>x.id===id);Object.assign(t.levels,lv)}
SCI_TOPICS.forEach(t=>Object.values(t.levels).forEach(l=>{l.n=l.g.list?l.g.list.length:99}));

const SUBJECTS={math:{id:'math',name:'Mathematics',th:'คณิตศาสตร์',short:'Math',topics:TOPICS},sci:{id:'sci',name:'Science',th:'วิทยาศาสตร์',short:'Science',topics:SCI_TOPICS}};
const ALL_TOPICS=[...TOPICS,...SCI_TOPICS];
TOPICS.forEach(t=>Object.values(t.levels).forEach(l=>{if(!l.n)l.n=99}));
const TOPIC=Object.fromEntries(ALL_TOPICS.map(t=>[t.id,t]));
ALL_TOPICS.forEach(t=>{t.lv=Object.keys(t.levels).map(Number);t.min=Math.min(...t.lv);t.max=Math.max(...t.lv)});
function nearestLevel(t,L){const tp=TOPIC[t];return tp.lv.reduce((b,x)=>Math.abs(x-L)<Math.abs(b-L)?x:b,tp.lv[0])}
function genItem(meta){const tp=TOPIC[meta.t];const lv=tp.levels[meta.L];const it=lv.g(mkR(meta.s));it.skill=lv.s;it.topic=tp.name;return it}

/* ---------- scale & scoring (Rasch-style, EAP) ---------- */
const SCALE={b:L=>140+8*L,lvl:th=>(th-140)/8,gradeCenter:g=>136+16*g,min:136,max:292};
const gradeLabel=g=>+g<=6?'ป.'+g:'ม.'+(g-6);const gradeLabelEn=g=>'Grade '+g;
function levelLabel(L){if(L<1)return 'ต่ำกว่าต้น ป.1';if(L>18)return 'สูงกว่า ม.3';return (L%2?'ต้น ':'ปลาย ')+gradeLabel(Math.ceil(L/2))}
function levelLabelEn(L){if(L<1)return 'Below Grade 1';if(L>18)return 'Above Grade 9';return (L%2?'Early':'Late')+' Grade '+Math.ceil(L/2)}
function scoreLabel(th){return levelLabel(Math.round(SCALE.lvl(th)))}
function pCorrect(th,b,nc){const c=0.8/(nc||4);return c+(1-c)/(1+Math.exp(-(th-b)/8))}
function eap(resps,m0,sd0){let sw=0,sm=0,sq=0;for(let th=100;th<=330;th+=1){let lp=-((th-m0)**2)/(2*sd0*sd0);for(const r of resps){const p=pCorrect(th,SCALE.b(r.L),r.nc);lp+=Math.log(r.c?p:1-p)}const w=Math.exp(lp);sw+=w;sm+=w*th;sq+=w*th*th}
  const m=sm/sw;return{theta:m,se:Math.sqrt(Math.max(0,sq/sw-m*m))}}
function itemKey(it){return it.q+'|'+it.fig+'|'+it.choices.join('|')}
function itemFamily(it){const m=/aria-label="([^"]+)"/.exec(it.fig||'');if(m)return 'fig:'+m[1];const st=it.q.replace(/<[^>]+>/g,'').replace(/[\d.,]+/g,'#').replace(/\s+/g,' ').trim();return st.replace(/[#=+−×÷ ]/g,'').length>25?'q:'+st:null}
function pickNext(state,rng){const rnd=rng||Math.random;const tps=state.topics||TOPICS;const target=clamp(Math.round(SCALE.lvl(state.theta)),1,18);
  const counts={},usedL={};tps.forEach(t=>counts[t.id]=0);state.resp.forEach(r=>{counts[r.t]=(counts[r.t]||0)+1;const k=r.t+':'+r.L;usedL[k]=(usedL[k]||0)+1});
  const usedQ=new Set(),usedF=new Set();state.resp.forEach(r=>{const it=genItem(r);usedQ.add(itemKey(it));const f=itemFamily(it);if(f)usedF.add(f)});
  const prev=state.prev||new Set();const last=state.resp.length?state.resp[state.resp.length-1].t:null;
  const cands=[];for(const t of tps)for(const L of t.lv){const u=usedL[t.id+':'+L]||0;if(u>=t.levels[L].n)continue;
    cands.push({t:t.id,L,sc:counts[t.id]*10+Math.abs(L-target)*6+(t.id===last?100:0)+u*25+rnd()*4})}
  cands.sort((x,y)=>x.sc-y.sc);const top=cands.slice(0,12);
  /* strict → relaxed: new to this student, new picture/template, never an exact repeat */
  const tests=[(it,k,f)=>!usedQ.has(k)&&!prev.has(k)&&!(f&&usedF.has(f)),(it,k,f)=>!usedQ.has(k)&&!(f&&usedF.has(f)),(it,k)=>!usedQ.has(k)];
  for(const ok of tests)for(const c of top){for(let i=0;i<12;i++){const s=newSeed();const it=genItem({t:c.t,L:c.L,s});const k=itemKey(it);if(ok(it,k,itemFamily(it)))return{t:c.t,L:c.L,s}}}
  const c=top[0]||{t:tps[0].id,L:nearestLevel(tps[0].id,target)};return{t:c.t,L:c.L,s:newSeed()}}
function subjTopics(sub){return (SUBJECTS[sub||'math']||SUBJECTS.math).topics}

  ${ts.length?`<section class="panel"><div class="panel-h"><h2>พัฒนาการ ${SUBJECTS[SB].name}</h2><div class="legend"><span><i style="background:var(--accent)"></i>คะแนนสเกล (เส้นแนวตั้ง = ช่วงความคลาดเคลื่อน)</span><span><i style="background:var(--accent-soft-2);border-radius:2px"></i>ช่วงคะแนนของชั้น ${gradeLabel(s.grade)}</span></div></div>${growthChart(ts,s.grade)}</section>

  ${ps.length?`<section class="panel"><h2 style="margin-bottom:8px">ประวัติการฝึก</h2><div class="tbl-wrap"><table class="list"><thead><tr><th>วันที่</th><th>สาระที่ฝึก</th><th>ทำถูก</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${fmtDT(p.createdAt)}</td><td>${(p.strands||[]).map(id=>TOPIC[id]?TOPIC[id].name:id).join(', ')}${p.strands&&p.strands[0]&&SCI_TOPICS.some(t=>t.id===p.strands[0])?' <span class="pill none">Science</span>':' <span class="pill none">Math</span>'}</td><td class="num">${p.score} / ${p.total}</td><td><button class="btn" data-act="dlPractice" data-pid="${p.id}">🖨 พิมพ์ชุดนี้</button></td></tr>`).join('')}</tbody></table></div></section>`:''}`}
function growthChart(ts,grade){const W=720,H=240,x0=56,x1=W-20,y0=H-34,y1=14;const lo=SCALE.min,hi=SCALE.max;const Y=v=>y0-(clamp(v,lo,hi)-lo)/(hi-lo)*(y0-y1);const n=ts.length;const X=i=>n===1?(x0+x1)/2:x0+i*(x1-x0)/(n-1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟพัฒนาการคะแนน">`;const gl=SCALE.gradeCenter(grade)-8,gh=SCALE.gradeCenter(grade)+8;
  s+=`<rect class="bandr" x="${x0}" y="${Y(gh+8)}" width="${x1-x0}" height="${Y(gl-8)-Y(gh+8)}"/>`;
  for(let g=1;g<=9;g++){const v=128+16*g;s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${x0-8}" y="${Y(v+8)+4}" text-anchor="end">${gradeLabel(g)}</text>`}
  const pts=ts.map((t,i)=>{const a=an(t);return[X(i),Y(a.theta),a]});s+=`<polyline class="ln" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
  pts.forEach(([x,y,a],i)=>{s+=`<line class="wh" x1="${x}" x2="${x}" y1="${Y(a.theta+a.se)}" y2="${Y(a.theta-a.se)}"/><circle class="pt" cx="${x}" cy="${y}" r="7"/><text class="ax" x="${x}" y="${y-14}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${Math.round(a.theta)}</text><text class="ax" x="${x}" y="${H-10}" text-anchor="middle">${fmtDate(ts[i].finishedAt)}</text>`});
  return s+'</svg>'}

/* ---------- scale visuals ---------- */
const pct=v=>(clamp(v,SCALE.min,SCALE.max)-SCALE.min)/(SCALE.max-SCALE.min)*100;
function bigScale(a,grade){let s='<div class="scale" aria-hidden="true"><div class="track"></div>';
  for(let g=1;g<=9;g++){const l=pct(128+16*g),r=pct(144+16*g);s+=`<div class="band${g===+grade?' me':''}" style="left:${l}%;width:${r-l}%"><span>${gradeLabel(g)}</span></div>`}
  s+=`<div class="rng" style="left:${pct(a.theta-a.se)}%;width:${pct(a.theta+a.se)-pct(a.theta-a.se)}%"></div><div class="dot" style="left:${pct(a.theta)}%"></div></div>`;return s}
function strandBlock(a,grade,full){const gl=pct(SCALE.gradeCenter(grade)-8),gr=pct(SCALE.gradeCenter(grade)+8);
  return `<div>${a.strands.map(st=>{const p=STAT[st.status];const cls=p[0]==='none'?'':p[0];
  const lv=full?`<div class="lvls">${st.passed.map(L=>`<span class="lv ok" title="${esc(TOPIC[st.id].levels[L].s)}">✓ ${levelLabel(L)}</span>`).join('')}${st.missed.map(L=>`<span class="lv no" title="${esc(TOPIC[st.id].levels[L].s)}">✗ ${levelLabel(L)}</span>`).join('')}</div>`:'';
  return `<div class="strand"><div><div class="nm">${st.name}</div><div class="meta">${st.n?`ตอบถูก ${st.k}/${st.n} ข้อ · ประมาณ ${Math.round(st.est)} (${scoreLabel(st.est)})`:'ไม่มีข้อสอบในสาระนี้'}</div>${lv}</div>
  <div class="mini ${cls}">${`<div class="gb" style="left:${gl}%;width:${gr-gl}%"></div>`}${st.n?`<div class="r" style="left:${pct(st.est-st.se)}%;width:${pct(st.est+st.se)-pct(st.est-st.se)}%"></div><div class="d" style="left:${pct(st.est)}%"></div>`:''}</div>
  <div><span class="pill ${p[0]}">${p[1]}</span>${st.rel&&st.status!=='weak'?` <span class="pill warn">ต่ำกว่าภาพรวม</span>`:''}</div></div>`}).join('')}
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent-soft-2);border-radius:2px"></i>ช่วงคะแนนที่คาดหวังของ ${gradeLabel(grade)}</span><span>จุด = คะแนนประมาณของสาระ แถบจาง = ช่วงความคลาดเคลื่อน</span></div></div>`}
function pathChart(t,a){const R=t.responses;const W=720,H=250,x0=56,x1=W-16,y0=H-30,y1=12;const lo=SCALE.min,hi=SCALE.max;const Y=v=>y0-(clamp(v,lo,hi)-lo)/(hi-lo)*(y0-y1);const X=i=>x0+(i+.5)*(x1-x0)/R.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นทางความยากของข้อสอบ">`;const gc=a.gc;
  s+=`<rect class="bandr" x="${x0}" y="${Y(gc+8)}" width="${x1-x0}" height="${Y(gc-8)-Y(gc+8)}"/>`;
  for(let g=1;g<=9;g++){const v=128+16*g;s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${x0-8}" y="${Y(v+8)+4}" text-anchor="end">${gradeLabel(g)}</text>`}
  const m0=SCALE.gradeCenter(t.grade);const th=R.map((_,i)=>eap(R.slice(0,i+1),m0,24).theta);s+=`<polyline class="ln" points="${th.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
  R.forEach((r,i)=>{s+=`<circle class="${r.c?'ok':'no'}" cx="${X(i)}" cy="${Y(SCALE.b(r.L))}" r="6"><title>ข้อ ${i+1}: ${TOPIC[r.t].name} · ${levelLabel(r.L)} · ${r.c?'ถูก':'ผิด'}</title></circle>`;if(R.length<=30||i%5===4)s+=`<text class="ax" x="${X(i)}" y="${H-10}" text-anchor="middle">${i+1}</text>`});
  return s+'</svg>'}

  <div class="tile"><div class="k">เทียบกับชั้น ${gradeLabel(t.grade)}</div><div class="v" style="font-size:1.1rem"><span class="pill ${o[0]}">${o[1]}</span></div></div></div>
  <div style="margin-top:16px">${bigScale(a,t.grade)}</div><p class="sub" style="margin:22px 0 0">ข้อสอบแบบปรับระดับมักทำถูกราว 50–70% เพราะระบบเลือกข้อที่ท้าทายพอดีกับเด็ก เปอร์เซ็นต์ถูกจึงไม่ใช่ตัวชี้วัดหลัก ให้ดูคะแนนสเกลและระดับเทียบชั้นแทน</p></section>
  <section class="panel"><h2 style="margin-bottom:6px">ผลรายสาระ</h2><p class="sub" style="margin:0 0 8px">ป้ายสีเขียว = ระดับที่ตอบถูก ป้ายสีแดง = ระดับที่ยังตอบผิด (ชี้เมาส์เพื่อดูชื่อทักษะ)</p>${strandBlock(a,t.grade,true)}</section>
  <div class="two"><section class="panel"><h2>หัวข้อที่ควรปรับปรุง</h2>${weak.length?weak.map(w=>`<div style="margin-top:12px"><b>${w.name}</b> <span class="pill ${STAT[w.status][0]}">${STAT[w.status][1]}</span>
    <ul class="skills">${(w.missed.length?w.missed:[clamp(Math.round(SCALE.lvl(w.est)),TOPIC[w.id].min,TOPIC[w.id].max)]).map(L=>{const L2=nearestLevel(w.id,L);return `<li>${TOPIC[w.id].levels[L2].s} <span>· ระดับ${levelLabel(L2)}</span></li>`}).join('')}</ul></div>`).join(''):'<p class="sub">ไม่มีสาระที่ต่ำกว่าระดับชั้นอย่างชัดเจน ให้ฝึกต่อในระดับที่สูงขึ้นเพื่อพัฒนาต่อ</p>'}</section>
  <section class="panel"><h2>สิ่งที่ทำได้ดี</h2>${(strong.length?strong:a.strands.filter(x=>x.n&&x.passed.length).sort((p,q)=>q.est-p.est).slice(0,3)).map(w=>`<div style="margin-top:12px"><b>${w.name}</b>
    <ul class="skills">${w.passed.slice(-3).map(L=>`<li>${TOPIC[w.id].levels[L].s} <span>· ระดับ${levelLabel(L)}</span></li>`).join('')}</ul></div>`).join('')||'<p class="sub">ยังไม่มีข้อมูลเพียงพอ</p>'}</section></div>
  <section class="panel"><div class="panel-h"><h2>เส้นทางความยากระหว่างสอบ</h2><div class="legend"><span><i style="background:var(--good)"></i>ตอบถูก</span><span><i style="background:var(--bad)"></i>ตอบผิด</span><span><i style="background:var(--accent)"></i>คะแนนที่ระบบประเมินหลังแต่ละข้อ</span></div></div>${pathChart(t,a)}
  <p class="sub" style="margin:4px 0 0">แต่ละจุดคือระดับความยากของข้อนั้น เมื่อเด็กตอบถูก ข้อต่อไปจะยากขึ้น เส้นจะค่อยๆ นิ่งเมื่อระบบพบระดับที่เหมาะกับเด็ก</p></section>
  <section class="panel"><h2 style="margin-bottom:10px">ทบทวนข้อที่ตอบผิด (${wrong.length} ข้อ)</h2><div class="review">${wrong.map(({r,i})=>reviewItem(r,i)).join('')||'<p class="sub">ตอบถูกทุกข้อ</p>'}</div></section>`}
function reviewItem(r,i){const it=genItem(r);return `<div class="ritem"><div class="tag">ข้อ ${i+1} · ${it.topic} · ระดับ${levelLabel(r.L)} · ${it.skill}</div><div class="q">${it.q}</div>${it.fig?`<div class="qfig">${it.fig}</div>`:''}
  <div class="ans">ตอบ: <b style="color:var(--bad)">${r.ch>=0?LBL[r.ch]+'. '+it.choices[r.ch]:'ไม่ได้ตอบ'}</b> · คำตอบที่ถูก: <b style="color:var(--good)">${LBL[it.ans]}. ${it.choices[it.ans]}</b></div><div class="sub">วิธีคิด: ${it.ex}</div></div>`}

/* ---------- test mode ---------- */
function startTest(s,len,subj){subj=subj||'math';const m0=SCALE.gradeCenter(+s.grade);const prev=new Set();testsOf(s.id,subj).forEach(t=>t.responses.forEach(r=>{try{prev.add(itemKey(genItem(r)))}catch(e){}}));TS={sid:s.id,name:s.name,grade:+s.grade,len,subject:subj,topics:subjTopics(subj),prev,resp:[],theta:m0-8,se:24,m0,startedAt:Date.now(),phase:'intro',cur:null,sel:null};S.view='test';render();window.scrollTo(0,0)}
function nextQ(){const meta=pickNext(TS);TS.cur={meta,it:genItem(meta),t0:Date.now()};TS.sel=null}
function renderTest(){const T=TS;if(!T)return '';
  if(T.phase==='intro')return `<div class="qwrap"><div class="qcard" style="text-align:center;justify-items:center"><h1>Hello, ${esc(T.name)}!</h1>
    <p class="qtext" style="font-size:1.1rem;max-width:52ch;margin:0">This ${T.subject==='sci'?'science':'math'} test has ${T.len} questions. The questions get harder or easier depending on your answers. Some questions may feel very hard — that's okay! Just do your best and take your time.</p>
    <ul class="sub" style="text-align:left;margin:0"><li>Read each question carefully before you choose an answer.</li><li>Once you click Submit, you cannot go back.</li><li>You may use scratch paper.</li></ul>
    <div class="row"><button class="btn lg primary" data-act="testBegin">Start the test</button><button class="btn ghost" data-act="testQuit">Cancel</button></div></div></div>`;
  if(T.phase==='saving'||T.phase==='saved')return `<div class="qwrap"><div class="qcard" style="text-align:center;justify-items:center"><h1>You finished the test. Great job!</h1><p class="sub">${T.phase==='saving'?'Saving your results…':'Could not save. Please tell your teacher.'}</p>${T.phase==='saved'?`<div class="row"><button class="btn primary" data-act="testSave">Try saving again</button></div>`:''}</div></div>`;
  const n=T.resp.length+1,it=T.cur.it;
  return `<div class="qwrap"><div class="qhead"><div><b>${esc(T.name)}</b> <span class="sub">· ${SUBJECTS[T.subject].name} · Question ${n} of ${T.len}</span></div><button class="btn ghost" data-act="testQuit">Stop test</button></div>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${T.len}" aria-valuenow="${n-1}"><div style="width:${(n-1)/T.len*100}%"></div></div>
  <div class="qcard"><div class="qtext">${it.q}</div>${it.fig?`<div class="qfig">${it.fig}</div>`:''}
  <div class="choices">${it.choices.map((c,i)=>`<button class="choice" data-act="pick" data-i="${i}" aria-pressed="${T.sel===i}"><span class="lb">${LBL[i]}</span><span>${c}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn lg primary" data-act="testSubmit" ${T.sel===null?'disabled':''}>Submit</button></div></div></div>`}
async function testAnswer(){const T=TS;const it=T.cur.it,m=T.cur.meta;T.resp.push({t:m.t,L:m.L,s:m.s,nc:it.choices.length,ch:T.sel,c:T.sel===it.ans?1:0,ms:Date.now()-T.cur.t0});
  const e=eap(T.resp,T.m0,24);T.theta=e.theta;T.se=e.se;if(T.resp.length>=T.len){T.phase='saving';render();await testSave()}else{nextQ();render();window.scrollTo(0,0)}}
async function testSave(){const T=TS;T.phase='saving';render();const e=eap(T.resp,T.m0,24);const id=uid();const now=Date.now();
  const doc={studentId:T.sid,subject:T.subject,grade:T.grade,len:T.len,startedAt:T.startedAt,finishedAt:now,durationSec:Math.round((now-T.startedAt)/1000),responses:T.resp,theta:Math.round(e.theta*10)/10,se:Math.round(e.se*10)/10};
  const ok=await put('tests',id,doc);if(!ok){T.phase='saved';render();return}TS=null;S.view='report';S.tid=id;if(Store.mode!=='db'){}render();window.scrollTo(0,0)}

/* ---------- practice ---------- */
function recSet(t){return buildPractice(t,an(t),hashStr(t.id))}
function startPracticeFromTest(t){const p=recSet(t);PS={sid:t.studentId,testId:t.id,strands:p.strands,items:p.items,idx:0,res:[],checked:false,sel:null,title:'My Practice Set',save:true};PS.it=genItem(PS.items[0]);S.view='practice';render();window.scrollTo(0,0)}
function startPracticeSkill(t,L){const items=[...Array(10)].map(()=>({t,L,s:newSeed()}));PS={sid:null,strands:[t],items,idx:0,res:[],checked:false,sel:null,title:`Practice: ${TOPIC[t].levels[L].s}`,save:false};PS.it=genItem(items[0]);S.view='practice';render();window.scrollTo(0,0)}
function renderPractice(){const P=PS;if(!P)return '';const total=P.items.length;
  if(P.idx>=total){const by={};P.res.forEach(r=>{by[r.t]=by[r.t]||[0,0];by[r.t][1]++;if(r.c)by[r.t][0]++});const k=P.res.filter(r=>r.c).length;
    return `<div class="qwrap"><div class="qcard"><h1>Practice complete! You got ${k} out of ${total} correct.</h1><div>${Object.entries(by).map(([t,[a,b]])=>`<div class="strand" style="grid-template-columns:1fr auto"><div class="nm">${TOPIC[t].name}</div><div class="num">${a}/${b}</div></div>`).join('')}</div>
    <p class="sub" style="margin:0">${k/total>=.8?'Excellent work! Next time, try the MAP test again to see your growth.':'Review the questions you missed, then try a new practice set.'}</p>
    <div class="row"><button class="btn primary" data-act="practiceDone">Done</button></div></div></div>`}
  const it=P.it,m=P.items[P.idx];
  return `<div class="qwrap"><div class="qhead"><div><b>${esc(P.title)}</b> <span class="sub">· Question ${P.idx+1} of ${total} · ${TOPIC[m.t].name} · ${levelLabelEn(m.L)}</span></div><button class="btn ghost" data-act="practiceQuit">Exit</button></div>
  <div class="prog"><div style="width:${P.idx/total*100}%"></div></div>
  <div class="qcard"><div class="tag">${it.skill}</div><div class="qtext">${it.q}</div>${it.fig?`<div class="qfig">${it.fig}</div>`:''}
  <div class="choices">${it.choices.map((c,i)=>{let cl='';if(P.checked){if(i===it.ans)cl=' right';else if(i===P.sel)cl=' wrong'}return `<button class="choice${cl}" data-act="ppick" data-i="${i}" aria-pressed="${P.sel===i}" ${P.checked?'disabled':''}><span class="lb">${LBL[i]}</span><span>${c}</span></button>`}).join('')}</div>
  ${P.checked?`<div class="fb ${P.sel===it.ans?'ok':'no'}"><b>${P.sel===it.ans?'Correct!':'Not quite. The answer is '+LBL[it.ans]+'. '+it.choices[it.ans]}</b><div>${it.ex}</div></div>`:''}
  <div class="row" style="justify-content:flex-end">${P.checked?`${P.sel!==it.ans?`<button class="btn" data-act="pagain">Try a similar question</button>`:''}<button class="btn lg primary" data-act="pnext">Next</button>`:`<button class="btn lg primary" data-act="pcheck" ${P.sel===null?'disabled':''}>Check answer</button>`}</div></div></div>`}
async function practiceFinishSave(){const P=PS;if(!P||!P.save||!P.sid||P.saved)return;P.saved=true;const k=P.res.filter(r=>r.c).length;
  await put('practice',uid(),{studentId:P.sid,testId:P.testId||null,strands:P.strands,createdAt:Date.now(),score:k,total:P.res.length,results:P.res,items:P.items})}

  let detail='';if(sel){const tp=TOPIC[sel.t],lv=tp.levels[sel.L];const items=[0,1].map(k=>genItem({t:sel.t,L:sel.L,s:S.bankSeed*31+k*7+sel.L*1009}));

    <div class="review">${items.map((it,k)=>`<div class="ritem"><div class="tag">ตัวอย่างที่ ${k+1}</div><div class="q">${it.q}</div>${it.fig?`<div class="qfig">${it.fig}</div>`:''}<div class="ans">${it.choices.map((c,i)=>`<span style="margin-right:18px;${i===it.ans?'color:var(--good);font-weight:700':''}">${LBL[i]}. ${c}</span>`).join('')}</div><div class="sub">เฉลย: ${it.ex}</div></div>`).join('')}</div></section>`}
  const BT=subjTopics(S.bsubj);const total=BT.reduce((s,t)=>s+t.lv.length,0);
  const M=S.multi,pk=new Set(S.picks);const nq=S.picks.length*S.per;
  const bar=M?`<div class="panel" style="position:sticky;top:58px;z-index:4;border-color:var(--accent);display:grid;gap:10px">
  <div class="row"><b>เลือกแล้ว ${S.picks.length} ทักษะ · รวม ${nq} ข้อ</b><span class="sub">กดช่องเพื่อเลือก/ยกเลิก · กดชื่อสาระเพื่อเลือกทั้งแถว · กดหัวคอลัมน์เพื่อเลือกทั้งระดับ</span></div>
  <div class="row"><label class="sub" for="ws-per">ข้อต่อทักษะ</label><select class="input" id="ws-per">${[2,3,4,5,6,8,10].map(n=>`<option ${n===S.per?'selected':''}>${n}</option>`).join('')}</select>
  <label class="sub" for="ws-title">ชื่อใบงาน</label><input class="input" id="ws-title" style="flex:1 1 220px" placeholder="เช่น Grade 4 Review Worksheet" value="${esc(S.wsTitle)}">
  <button class="btn" data-act="bankClear" ${S.picks.length?'':'disabled'}>ล้างที่เลือก</button><button class="btn primary" data-act="bankMultiPrint" ${S.picks.length?'':'disabled'}>🖨 พิมพ์ใบงานรวม</button></div>
  ${S.picks.length?`<div class="lvls">${S.picks.map(k=>{const [t,L]=k.split(':');return `<button class="lv ok" style="cursor:pointer" data-act="bankToggle" data-k="${k}" title="นำออก">${TOPIC[t].short} · ${levelLabel(+L)} · ${TOPIC[t].levels[L].s} ✕</button>`}).join('')}</div>`:''}
  ${nq>120?'<div class="notice">ใบงานยาวมาก แนะนำไม่เกิน 120 ข้อต่อชุด</div>':''}</div>`:'';
  return `<section class="panel"><div class="panel-h"><div><h1>คลังข้อสอบและแบบฝึกหัด</h1><div class="chips" style="margin:8px 0">${['math','sci'].map(k=>`<button class="chip" data-act="bsubj" data-s="${k}" aria-pressed="${S.bsubj===k}">${SUBJECTS[k].name}</button>`).join('')}<span style="width:14px"></span>${[['p','ประถม ป.1–6'],['m','มัธยมต้น ม.1–3'],['all','ทั้งหมด']].map(([k,t])=>`<button class="chip" data-act="brange" data-r="${k}" aria-pressed="${(S.brange||'p')===k}">${t}</button>`).join('')}</div><div class="sub">${SUBJECTS[S.bsubj].name}: ${BT.length} สาระ · ${total} ทักษะ · แต่ละทักษะสุ่มสร้างโจทย์ใหม่ได้ไม่จำกัด พร้อมเฉลยและวิธีคิด เลือกช่องเพื่อดูตัวอย่าง ฝึก หรือพิมพ์ใบงาน</div></div><button class="btn ${M?'primary':''}" data-act="bankMode" aria-pressed="${M}">${M?'✓ โหมดเลือกหลายทักษะ (กดเพื่อปิด)':'☐ เลือกหลายทักษะเพื่อพิมพ์รวม'}</button></div>
  ${bar}<div class="tbl-wrap"><table class="bank"><thead><tr><th class="tn">สาระ</th>${cols.map(L=>`<th>${M?`<button class="colsel" data-act="bankCol" data-l="${L}">${levelLabel(L)}</button>`:levelLabel(L)}<br><span class="num">${SCALE.b(L)}</span></th>`).join('')}</tr></thead><tbody>

/* ---------- guide ---------- */
function renderGuide(){return `<section class="panel"><h1 style="margin-bottom:10px">วิธีใช้และการแปลผล</h1>
  <div class="two"><div><h3>ขั้นตอนการใช้ในสถาบัน</h3><ol style="padding-left:1.2em;margin:8px 0 0;display:grid;gap:6px">
  <li>ครูเพิ่มรายชื่อนักเรียนพร้อมระดับชั้นปัจจุบัน</li><li>เปิดหน้านักเรียน เลือกจำนวนข้อ แล้วกด "เริ่มสอบ MAP" ให้เด็กทำบนเครื่องของสถาบัน</li>
  <li>เมื่อทำครบ ระบบบันทึกผลและแสดงรายงานทันที</li><li>กด "เริ่มชุดฝึกเฉพาะบุคคล" ให้เด็กฝึกต่อ หรือ "ดาวน์โหลดใบงาน" ไปพิมพ์เป็นการบ้าน</li><li>สอบซ้ำทุก 6–8 สัปดาห์เพื่อดูกราฟพัฒนาการ</li></ol>
  <h3 style="margin-top:16px">ให้ครูคนอื่นใช้ร่วมกัน</h3><p class="sub" style="margin:6px 0 0">เจ้าของหน้ากด Share แล้วเชิญเพื่อนครูทางอีเมลด้วยสิทธิ์ Can edit ทุกคนจะเห็นรายชื่อและผลสอบชุดเดียวกัน ผู้ที่ได้สิทธิ์ Can view หรือเปิดจากลิงก์สาธารณะจะไม่เห็นข้อมูลนักเรียน เพื่อปกป้องข้อมูลส่วนตัวของเด็ก</p></div>
  <div><h3>การทำงานของการปรับระดับ</h3><p class="sub" style="margin:6px 0 0">ระบบประเมินความสามารถหลังทุกข้อด้วยแบบจำลองการตอบข้อสอบ (Item Response Theory แบบ Rasch) แล้วเลือกข้อถัดไปให้ความยากใกล้ระดับที่ประเมินได้ที่สุด พร้อมหมุนเวียนสาระให้ครบอย่างสมดุล ยิ่งทำมากข้อ ช่วงความคลาดเคลื่อนยิ่งแคบลง</p>

function simulate(grade,trueTh,len,when,subj){subj=subj||'math';const m0=SCALE.gradeCenter(grade);const st={theta:m0-8,resp:[],topics:subjTopics(subj)};for(let i=0;i<len;i++){const m=pickNext(st);const it=genItem(m);const bias={frac:-14,meas:-10,add:8,earth:-14,inq:6}[m.t]||0;
  const p=pCorrect(trueTh+bias,SCALE.b(m.L),it.choices.length);const c=Math.random()<p;st.resp.push({t:m.t,L:m.L,s:m.s,nc:it.choices.length,ch:c?it.ans:(it.ans+1)%it.choices.length,c:c?1:0,ms:20000+Math.round(Math.random()*60000)});Object.assign(st,eap(st.resp,m0,24))}
  return{subject:subj,grade,len,startedAt:when-len*55000,finishedAt:when,durationSec:len*55,responses:st.resp,theta:Math.round(st.theta*10)/10,se:Math.round(st.se*10)/10}}

  dlWorksheet:d=>{const t=Store.tests.find(x=>x.id===d.tid);const s=Store.students.find(x=>x.id===t.studentId)||{name:''};const p=recSet(t);download(`ใบงานเฉพาะบุคคล-${s.name}.html`.replace(/\s+/g,'-'),worksheetHTML(`Personal Practice Worksheet: ${s.name}`,`Based on MAP test of ${new Date(t.finishedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · Focus: ${p.strands.map(x=>TOPIC[x].name).join(', ')}`,p.items))},
  dlPractice:d=>{const p=Store.practices.find(x=>x.id===d.pid);if(!p)return;const s=Store.students.find(x=>x.id===p.studentId)||{name:''};const items=(p.items&&p.items.length?p.items:p.results||[]).map(r=>({t:r.t,L:r.L,s:r.s})).filter(r=>TOPIC[r.t]&&TOPIC[r.t].levels[r.L]);
    if(!items.length){toast('ชุดฝึกนี้ไม่มีข้อมูลข้อสอบให้พิมพ์');return}download(`ชุดฝึก-${s.name}-${new Date(p.createdAt).toISOString().slice(0,10)}.html`.replace(/\s+/g,'-'),worksheetHTML(`Practice Set: ${s.name}`,`Practiced on ${new Date(p.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · Focus: ${(p.strands||[]).map(x=>TOPIC[x]?TOPIC[x].name:x).join(', ')} · ${items.length} questions`,items))},
  dlReport:d=>{const t=Store.tests.find(x=>x.id===d.tid);const s=Store.students.find(x=>x.id===t.studentId)||{name:''};download(`รายงาน-MAP-${SUBJECTS[subjOf(t)].short}-${s.name}-${new Date(t.finishedAt).toISOString().slice(0,10)}.html`.replace(/\s+/g,'-'),reportHTML(t))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){f(el.dataset,el,e)}});
document.addEventListener('keydown',e=>{if(e.target.matches('tr[data-act]')&&e.key==='Enter'){e.target.click();return}
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
  if(S.view==='test'&&TS&&TS.phase==='q'&&!$('#modal').innerHTML){const i='1234'.indexOf(e.key);if(i>=0&&i<TS.cur.it.choices.length){TS.sel=i;render()}else if(e.key==='Enter'&&TS.sel!==null){e.preventDefault();testAnswer()}}});
document.addEventListener('change',e=>{if(e.target.id==='restore-file'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(x){toast('ไฟล์ไม่ถูกต้อง');return}
    if(!Array.isArray(d.students)||!Array.isArray(d.tests)){toast('ไม่ใช่ไฟล์สำรองของแอปนี้');return}
    modal(`<h2>นำเข้าข้อมูล</h2><p class="sub" style="margin:0">ไฟล์นี้มีนักเรียน ${d.students.length} คน · ผลสอบ ${d.tests.length} ครั้ง · การฝึก ${(d.practices||[]).length} ครั้ง</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">ยกเลิก</button><button class="btn" id="imp-merge">รวมกับข้อมูลเดิม</button><button class="btn primary" id="imp-replace">แทนที่ข้อมูลทั้งหมด</button></div>`);
    const apply=(rep)=>{const mg=(a,b)=>{const m=new Map((rep?[]:a).map(x=>[x.id,x]));b.forEach(x=>m.set(x.id,x));return [...m.values()]};Store.students=mg(Store.students,d.students);Store.tests=mg(Store.tests,d.tests);Store.practices=mg(Store.practices,d.practices||[]);anCache.clear();saveLocal();if(Store.sync){[['students',d.students],['tests',d.tests],['practice',d.practices||[]]].forEach(([col,arr])=>arr.forEach(x=>{const {id,...data}=x;Sync.outbox.push({action:'put',col,id,data})}));saveOutbox();flush()}closeModal();render();toast('นำเข้าข้อมูลเรียบร้อย')};
    $('#imp-merge').onclick=()=>apply(false);$('#imp-replace').onclick=()=>apply(true)})}});
document.addEventListener('change',e=>{if(e.target.id==='ws-per'){S.per=+e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='ws-title'){S.wsTitle=e.target.value;return}if(e.target.id==='q'){S.q=e.target.value;const r=$('#rows');if(r)r.innerHTML=studentRows()}});
render();initStore();

</script></body></html>
